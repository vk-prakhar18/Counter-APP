<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter APP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>
        Counter APP 
    </h1>
    <p>
        Make a count of it!
    </p>
    <div id="counting">
        <p id="numbers" style=" color: black;
        font-size: 7rem;
        padding-top: 4rem;">
            0
        </p>
    </div>
    <div id="counter-main">
        <div class="buttons">
            <div><img id="increase" src="increase.jpg" alt="Increase"></div>
            <div><img id="decrease" src="decrease.jpg" alt="Decrease"></div>
            <div><img id="reset" src="reset.jpg" alt="Reset"></div>
        </div>        
    </div>
    <script src="app.js"></script>
</body>
</html>
